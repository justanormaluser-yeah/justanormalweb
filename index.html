<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ tasks from somewhere</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* ICON HỆ THỐNG GÓC TRÊN BÊN TRÁI */
        .random-top-left-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 2.2rem;
            z-index: 900;
            user-select: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            background: #ffffff;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .random-top-left-icon:hover {
            transform: scale(1.15) rotate(10deg);
        }

        /* KHUNG CHÍNH TRÀN RỘNG TOÀN MÀN HÌNH */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2d3748;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        /* Khung cuộn chứa danh sách nút */
        .button-scroll-container {
            max-height: 75vh;
            overflow-y: auto;
            padding: 10px 15px 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button-scroll-container::-webkit-scrollbar {
            width: 8px;
        }

        .button-scroll-container::-webkit-scrollbar-track {
            background: #edf2f7;
            border-radius: 10px;
        }

        .button-scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        /* Nút bấm trải rộng 100% chiều ngang */
        .nav-btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            background: #ffffff;
            color: #4a5568;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            color: #667eea;
            box-shadow: 0 10px 15px -3px rgba(102, 126, 234, 0.25);
        }

        /* MODAL BẬT NỔI & LÀM MỜ NỀN */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        /* CẤU HÌNH Ô POPUP DÀI HƠN */
        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 1080px;
            height: 80vh;
            max-height: 920px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #a0aec0;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #e53e3e;
        }

        .modal-title {
            color: #2d3748;
            font-size: 1.3rem;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        /* VÙNG VĂN BẢN CUỘN BÊN TRONG POPUP */
        .text-display {
            color: #4a5568;
            font-size: 1.05rem;
            line-height: 1.6;
            white-space: pre;
            font-family: 'Consolas', 'Courier New', monospace;
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .text-display::-webkit-scrollbar {
            width: 6px;
        }
        .text-display::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        .copy-btn-modal {
            width: 100%;
            background: #38a169;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .copy-btn-modal:hover {
            background: #2f855a;
        }

        /* Toast thông báo */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(46, 160, 67, 0.95);
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* STYLES CHO HỘP CÂU ĐỐ ICON */
        .quiz-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .quiz-overlay.show {
            display: flex;
        }
        .quiz-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .quiz-timer {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin: 10px 0;
        }
        .quiz-input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }
        .quiz-btn {
            width: 100%;
            padding: 10px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .quiz-btn:hover {
            background: #3182ce;
        }

        /* POPUP KẾT QUẢ CÂU ĐỐ THAY THẾ ALERT */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;

            box-shadow: 0 10px 25px rgba(0,0,0,0.2);

            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            word-wrap: break-word;
        }
    </style>

// 0. Tạo icon ngẫu nhiên từ kho biểu tượng có sẵn trên máy tính người dùng (GIỮ NGUYÊN)
(function generateRandomSystemIcon() {
    const symbolRanges = [
        [0x2300, 0x23FF],
        [0x2600, 0x26FF],
        [0x2700, 0x27BF],
        [0x1F300, 0x1F5FF],
        [0x1F600, 0x1F64F],
        [0x1F680, 0x1F6FF],
        [0x1F900, 0x1F9FF],
        [0x1FA70, 0x1FAFF]
    ];

    const range = symbolRanges[Math.floor(Math.random() * symbolRanges.length)];
    const randomCodePoint = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
    
    document.getElementById('topLeftIcon').textContent = String.fromCodePoint(randomCodePoint);
})();

// XỬ LÝ SỰ KIỆN CLICK VÀO ICON GÓC TRÊN BÊN TRÁI
let quizTimerInterval = null;
let quizTimeLeft = 10;
const quizInput = document.getElementById('quizInput');

// 1. KHAI BÁO HÀM CHỈ LẤY SỐ 0 HOẶC 1 NGẪU NHIÊN
function getRandomBinaryDigit() {
    return Math.random() < 0.5 ? '0' : '1';
}

// 2. BẮT SỰ KIỆN: CHỈ GIỮ NGUYÊN 0 VÀ 1, KÝ TỰ KHÁC BIẾN THÀNH 0 HOẶC 1
quizInput.addEventListener('input', function() {
    let result = '';
    for (let i = 0; i < this.value.length; i++) {
        let char = this.value[i];
        if (char === '0' || char === '1') {
            result += char;
        } else {
            result += getRandomBinaryDigit();
        }
    }
    this.value = result;
});

document.getElementById('topLeftIcon').onclick = function() {
    document.getElementById('quizOverlay').classList.add('show');
    quizInput.value = '';
    quizInput.focus();
    
    quizTimeLeft = 10;
    document.getElementById('quizTimer').innerText = quizTimeLeft;
    
    clearInterval(quizTimerInterval);
    quizTimerInterval = setInterval(() => {
        quizTimeLeft--;
        document.getElementById('quizTimer').innerText = quizTimeLeft;
        if (quizTimeLeft <= 0) {
            finishQuiz("You are an idiot!\n 🤣🤣🤣");
        }
    }, 1000);
};

function checkQuizAnswer() {
    const val = quizInput.value.trim().toLowerCase();
    
    // Chấp nhận cả chữ "two" lẫn dạng nhị phân "10"
    if (val === "two" || val === "10") {
        finishQuiz("Well...that's right!\n Maybe you're smarter than I thought...");
    } else if (!isNaN(val) && val !== "") {
        const inputNum = parseInt(val);
        let num;
        do {
            num = Math.floor(Math.random() * 100) + 1;
        } while (num === 2 || num === inputNum);
        
        finishQuiz(num.toString());
    } else {
        finishQuiz("You are an idiot \n 🤣🤣🤣");
    }
}
function finishQuiz(message) {
    clearInterval(quizTimerInterval);
    document.getElementById('quizOverlay').classList.remove('show');
    showResultModal(message);
}

function showResultModal(msg) {
    document.getElementById('resultMessage').innerText = msg;
    document.getElementById('resultOverlay').classList.add('show');
}

function closeResultModal() {
    document.getElementById('resultOverlay').classList.remove('show');
}

quizInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkQuizAnswer();
    }
});

const modalOverlay = document.getElementById('modalOverlay');

function openModal(title, content) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('text-display').innerText = content;
    modalOverlay.classList.add('show');
}

function closeModal() {
    modalOverlay.classList.remove('show');
}

// Copy văn bản
function copyContentFromModal() {
    const textToCopy = document.getElementById('text-display').innerText;
    navigator.clipboard.writeText(textToCopy).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    });
}
