<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ tasks from somewhere</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* ICON HỆ THỐNG GÓC TRÊN BÊN TRÁI */
        .random-top-left-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 2.2rem;
            z-index: 900;
            user-select: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            background: #ffffff;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .random-top-left-icon:hover {
            transform: scale(1.30);
        }

        /* ICON HỘP QUÀ BIẾT BỎ CHẠY TRƯỢT MƯỢT MÀ */
        .gift-box-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 2.5rem;
            z-index: 1000;
            user-select: none;
            cursor: pointer;
            transition: left 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.1),
                        top 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.1),
                        transform 0.15s ease-out;
        }

        .gift-box-icon.panic {
            animation: tremor 0.1s infinite;
        }

        @keyframes tremor {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-1px, 1px) rotate(-1deg); }
            50% { transform: translate(1px, -1px) rotate(1deg); }
            75% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        /* HIỆU ỨNG PORTAL TELEPORT */
        .portal {
            position: fixed;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff 0%, #8a2be2 70%, transparent 100%);
            box-shadow: 0 0 20px #00ffff, 0 0 40px #8a2be2;
            z-index: 999;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: portalOpen 0.35s forwards ease-out;
        }

        @keyframes portalOpen {
            0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(1.3) rotate(360deg); }
        }

        .portal-exit {
            animation: portalClose 0.35s forwards ease-in;
        }

        @keyframes portalClose {
            0% { transform: translate(-50%, -50%) scale(1.3) rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(0) rotate(360deg); }
        }

        .gift-box-icon.sucking {
            transform: scale(0) rotate(720deg) !important;
            transition: transform 0.35s ease-in !important;
        }

        /* ĐẠN DẤU CHẤM */
        .dot-bullet {
            position: fixed;
            font-size: 2rem;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366, 0 0 20px #ff0055;
            pointer-events: none;
            z-index: 1001;
            transform: translate(-50%, -50%);
            transition: left 0.25s linear, top 0.25s linear;
        }

        /* HIỆU ỨNG HỘP QUÀ BỊ ĐÓNG BẰNG TẠM THỜI */
        .gift-box-icon.frozen {
            filter: drop-shadow(0 0 15px #00d2ff) brightness(1.2);
            animation: freezeShake 0.1s infinite !important;
        }

        @keyframes freezeShake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }

        /* HỘP QUÀ BỊ KẾT LIỄU */
        .gift-box-icon.paralyzed {
            filter: none !important;
            opacity: 1 !important;
            cursor: pointer !important;
        }

        /* CỤM 2 THANH NẰM DƯỚI CON TRỎ CHUỘT (CÁCH 5PX) */
        .bars-container {
            position: fixed;
            width: 17.5px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            pointer-events: none;
            z-index: 1002;
            transform: translate(-50%, 25px);
        }

        /* THANH TÍCH NĂNG LƯỢNG (Ở TRÊN) */
        .ult-bar-box {
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.8);
            border-radius: 2px;
            overflow: hidden;
        }

        .ult-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #00ffff);
            transition: width 0.2s ease-out;
        }

        .ult-bar-box.ready {
            animation: ultGlow 0.5s infinite alternate;
        }

        @keyframes ultGlow {
            from { border-color: #00ffff; box-shadow: 0 0 3px #00ffff; }
            to { border-color: #ff0055; box-shadow: 0 0 6px #ff0055; }
        }

        /* THANH HỒI CHIÊU (Ở DƯỚI) */
        .cooldown-bar-box {
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 2px;
            overflow: hidden;
        }

        .cooldown-bar-fill {
            width: 0%;
            height: 100%;
            background: #ff3366;
            transition: width 3s linear;
        }

        /* KHUNG CHÍNH TRÀN RỘNG TOÀN MÀN HÌNH */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2d3748;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        .button-scroll-container {
            max-height: 75vh;
            overflow-y: auto;
            padding: 10px 15px 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button-scroll-container::-webkit-scrollbar {
            width: 8px;
        }

        .button-scroll-container::-webkit-scrollbar-track {
            background: #edf2f7;
            border-radius: 10px;
        }

        .button-scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        /* MODAL BẬT NỔI & LÀM MỜ NỀN */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 1080px;
            height: 80vh;
            max-height: 920px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #a0aec0;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #e53e3e;
        }

        .modal-title {
            color: #2d3748;
            font-size: 1.3rem;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .text-display {
            color: #4a5568;
            font-size: 1.05rem;
            line-height: 1.6;
            white-space: pre;
            font-family: 'Consolas', 'Courier New', monospace;
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .copy-btn-modal {
            width: 100%;
            background: #38a169;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .copy-btn-modal:hover {
            background: #2f855a;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(46, 160, 67, 0.95);
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* QUIZ & RESULT POPUP */
        .quiz-overlay, .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .quiz-overlay.show, .result-overlay.show {
            display: flex;
        }

        .quiz-box, .result-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .quiz-timer {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin: 10px 0;
        }

        .quiz-input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        .quiz-btn {
            width: 100%;
            padding: 10px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .quiz-btn:hover {
            background: #3182ce;
        }

        .result-message {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<div class="random-top-left-icon" id="topLeftIcon" title="bleb bleb, don't click me">💻</div>

<div class="gift-box-icon" id="giftBoxIcon" title="catch me if you can">🎁</div>

<div class="bars-container" id="barsContainer">
    <div class="ult-bar-box" id="ultBox" title="Thanh Tích Chiêu">
        <div class="ult-bar-fill" id="ultFill"></div>
    </div>
    
    <div class="cooldown-bar-box" id="cooldownBox" style="display: none;">
        <div class="cooldown-bar-fill" id="cooldownFill"></div>
    </div>
</div>

<div class="container">
    <h2>My C++ tasks</h2>
    <div class="button-scroll-container" id="buttonList"></div>
</div>

<div class="quiz-overlay" id="quizOverlay">
    <div class="quiz-box">
        <h3>1 + 1 = ?</h3>
        <div class="quiz-timer" id="quizTimer">10</div>
        <input type="text" class="quiz-input" id="quizInput" placeholder="Type your answer here..." autocomplete="off">
        <button class="quiz-btn" onclick="checkQuizAnswer()">Send</button>
    </div>
</div>

<div class="result-overlay" id="resultOverlay">
    <div class="result-box">
        <div class="result-message" id="resultMessage"></div>
        <button class="quiz-btn" onclick="closeResultModal()">OK</button>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h3 class="modal-title" id="modalTitle">Tiêu đề mục</h3>
        <div id="text-display" class="text-display"></div>
        <button class="copy-btn-modal" onclick="copyContentFromModal()">📋 Copy</button>
    </div>
</div>

<div id="toast" class="toast">Copied!</div>

<script>
// 1. Tạo Icon ngẫu nhiên góc trái
(function generateRandomSystemIcon() {
    const symbolRanges = [
        [0x2300, 0x23FF], [0x2600, 0x26FF], [0x2700, 0x27BF],
        [0x1F300, 0x1F5FF], [0x1F600, 0x1F64F], [0x1F680, 0x1F6FF],
        [0x1F900, 0x1F9FF], [0x1FA70, 0x1FAFF]
    ];
    const range = symbolRanges[Math.floor(Math.random() * symbolRanges.length)];
    const randomCodePoint = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
    document.getElementById('topLeftIcon').textContent = String.fromCodePoint(randomCodePoint);
})();

const giftBox = document.getElementById('giftBoxIcon');
const barsContainer = document.getElementById('barsContainer');
const ultFill = document.getElementById('ultFill');
const ultBox = document.getElementById('ultBox');
const cooldownBox = document.getElementById('cooldownBox');
const cooldownFill = document.getElementById('cooldownFill');

if (giftBox) {
    const initRect = giftBox.getBoundingClientRect();
    giftBox.style.left = initRect.left + 'px';
    giftBox.style.top = initRect.top + 'px';
    giftBox.style.bottom = 'auto';
    giftBox.style.right = 'auto';
}

let trappedTimer = null;
let isTeleporting = false;
let mouseX = 0;
let mouseY = 0;
let isFrozen = false;
let isCoolingDown = false;
let ultEnergy = 0;
let isParalyzed = false;

// 2. Hàm tạo Portal & Teleport
function createPortal(x, y) {
    const portal = document.createElement('div');
    portal.className = 'portal';
    portal.style.left = x + 'px';
    portal.style.top = y + 'px';
    document.body.appendChild(portal);
    return portal;
}

function escapeThroughPortal(currentRect) {
    if (isTeleporting) return;
    isTeleporting = true;

    const giftCenterX = currentRect.left + currentRect.width / 2;
    const giftCenterY = currentRect.top + currentRect.height / 2;
    const entryPortal = createPortal(giftCenterX, giftCenterY);

    giftBox.classList.add('sucking');

    setTimeout(() => {
        const margin = 100;
        const maxX = window.innerWidth - currentRect.width - margin;
        const maxY = window.innerHeight - currentRect.height - margin;
        const newX = Math.floor(Math.random() * (maxX - margin)) + margin;
        const newY = Math.floor(Math.random() * (maxY - margin)) + margin;

        entryPortal.classList.add('portal-exit');
        setTimeout(() => entryPortal.remove(), 350);

        const exitPortal = createPortal(newX + currentRect.width / 2, newY + currentRect.height / 2);
        giftBox.style.left = newX + 'px';
        giftBox.style.top = newY + 'px';

        setTimeout(() => {
            giftBox.classList.remove('sucking');
            exitPortal.classList.add('portal-exit');
            setTimeout(() => {
                exitPortal.remove();
                isTeleporting = false;
            }, 350);
        }, 100);

    }, 350);
}

// 3. Xử lý di chuyển chuột và né tránh
document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;

    if (barsContainer) {
        barsContainer.style.left = mouseX + 'px';
        barsContainer.style.top = mouseY + 'px';
    }

    if (!giftBox || isTeleporting || isFrozen || isParalyzed) return;

    const rect = giftBox.getBoundingClientRect();
    const giftX = rect.left + rect.width / 2;
    const giftY = rect.top + rect.height / 2;

    const diffX = giftX - mouseX;
    const diffY = giftY - mouseY;
    const distance = Math.sqrt(diffX * diffX + diffY * diffY);
    const triggerDistance = 130;

    if (distance < triggerDistance) {
        giftBox.classList.add('panic');
        const margin = 20; 
        const maxRight = window.innerWidth - rect.width - margin;
        const maxBottom = window.innerHeight - rect.height - margin;

        // KIỂM TRA CHẠM BẤT KỲ MÉP / GÓC NÀO CỦA MÀN HÌNH
        const isNearLeft = rect.left <= margin + 25;
        const isNearRight = rect.left >= maxRight - 25;
        const isNearTop = rect.top <= margin + 25;
        const isNearBottom = rect.top >= maxBottom - 25;

        const isTrapped = isNearLeft || isNearRight || isNearTop || isNearBottom;

        if (isTrapped) {
            if (!trappedTimer) {
                trappedTimer = setTimeout(() => {
                    escapeThroughPortal(rect);
                    trappedTimer = null;
                }, 200); // 200ms để kích hoạt portal nhanh chóng
            }
        } else if (trappedTimer) {
            clearTimeout(trappedTimer);
            trappedTimer = null;
        }

        const fleeStrength = (triggerDistance - distance) + 120;
        let targetX = giftX + (diffX / (distance || 1)) * fleeStrength;
        let targetY = giftY + (diffY / (distance || 1)) * fleeStrength;

        targetX = Math.max(margin, Math.min(targetX, maxRight));
        targetY = Math.max(margin, Math.min(targetY, maxBottom));

        giftBox.style.left = (targetX - rect.width / 2) + 'px';
        giftBox.style.top = (targetY - rect.height / 2) + 'px';
    } else {
        giftBox.classList.remove('panic');
        if (trappedTimer) {
            clearTimeout(trappedTimer);
            trappedTimer = null;
        }
    }
});

// 4. Sự kiện phím
document.addEventListener('keydown', function(e) {
    if (e.altKey && (e.key === '.' || e.code === 'Period')) {
        e.preventDefault();
        if (ultEnergy >= 20 && !isParalyzed) {
            executeUltimateAttack();
        }
        return;
    }

    if (e.key === '.' && giftBox && !isFrozen && !isCoolingDown && !isParalyzed) {
        shootDotBullet();
    }
});

// 5. Bắn đạn & Hồi chiêu
function shootDotBullet() {
    isCoolingDown = true;

    cooldownBox.style.display = 'block';
    cooldownFill.style.transition = 'none';
    cooldownFill.style.width = '0%';

    requestAnimationFrame(() => {
        cooldownFill.style.transition = 'width 3s linear';
        cooldownFill.style.width = '100%';
    });

    if (ultEnergy < 20) {
        ultEnergy++;
        const percent = (ultEnergy / 20) * 100;
        ultFill.style.width = percent + '%';

        if (ultEnergy === 20) {
            ultBox.classList.add('ready');
        }
    }

    const rect = giftBox.getBoundingClientRect();
    const targetX = rect.left + rect.width / 2;
    const targetY = rect.top + rect.height / 2;

    const bullet = document.createElement('div');
    bullet.className = 'dot-bullet';
    bullet.innerText = '•';
    bullet.style.left = mouseX + 'px';
    bullet.style.top = mouseY + 'px';
    document.body.appendChild(bullet);

    requestAnimationFrame(() => {
        bullet.style.left = targetX + 'px';
        bullet.style.top = targetY + 'px';
    });

    setTimeout(() => {
        bullet.remove();
        isFrozen = true;
        giftBox.classList.remove('panic');
        giftBox.classList.add('frozen');

        setTimeout(() => {
            isFrozen = false;
            giftBox.classList.remove('frozen');
        }, 1000);
    }, 250);

    setTimeout(() => {
        isCoolingDown = false;
        cooldownBox.style.display = 'none';
    }, 3000);
}

// 6. Tuyệt chiêu
function executeUltimateAttack() {
    ultEnergy = 0;
    ultFill.style.width = '0%';
    ultBox.classList.remove('ready');

    const rect = giftBox.getBoundingClientRect();
    const targetX = rect.left + rect.width / 2;
    const targetY = rect.top + rect.height / 2;

    const ultBeam = document.createElement('div');
    ultBeam.style.cssText = `
        position: fixed; left: ${mouseX}px; top: ${mouseY}px;
        width: 10px; height: 10px; background: #00ffff;
        box-shadow: 0 0 30px 15px #ff0055; border-radius: 50%;
        z-index: 1003; transition: all 0.2s ease-in;
    `;
    document.body.appendChild(ultBeam);

    requestAnimationFrame(() => {
        ultBeam.style.left = targetX + 'px';
        ultBeam.style.top = targetY + 'px';
        ultBeam.style.transform = 'scale(3)';
    });

    setTimeout(() => {
        ultBeam.remove();
        isParalyzed = true;
        giftBox.classList.remove('panic', 'frozen');
        giftBox.classList.add('paralyzed');
    }, 200);
}

if (giftBox) {
    giftBox.addEventListener('click', function() {
        if (isParalyzed) {
            alert("chẳng có j hết, hahaha");
        }
    });
}

// 7. Quiz & Result Modal
let quizTimerInterval = null;
let quizTimeLeft = 10;
const quizInput = document.getElementById('quizInput');

function getRandomFrom3To9() {
    const validDigits = ['3', '4', '5', '6', '7', '8', '9'];
    return validDigits[Math.floor(Math.random() * validDigits.length)];
}

quizInput.addEventListener('input', function() {
    let result = '';
    for (let i = 0; i < this.value.length; i++) {
        let char = this.value[i];
        if (char === '0' || char === '1' || (char >= '3' && char <= '9')) {
            result += char;
        } else {
            result += getRandomFrom3To9();
        }
    }
    this.value = result;
});

document.getElementById('topLeftIcon').onclick = function() {
    document.getElementById('quizOverlay').classList.add('show');
    quizInput.value = '';
    quizInput.focus();
    
    quizTimeLeft = 10;
    document.getElementById('quizTimer').innerText = quizTimeLeft;
    
    clearInterval(quizTimerInterval);
    quizTimerInterval = setInterval(() => {
        quizTimeLeft--;
        document.getElementById('quizTimer').innerText = quizTimeLeft;
        if (quizTimeLeft <= 0) {
            finishQuiz("You are an idiot!\n 🤣🤣🤣");
        }
    }, 1000);
};

function checkQuizAnswer() {
    const val = quizInput.value.trim().toLowerCase();
    if (val === "two" || val === "10") {
        finishQuiz("Well...that's right!\n Maybe you're smarter than I thought...");
    } else {
        finishQuiz("You are an idiot! \n 🤣🤣🤣");
    }
}

function finishQuiz(message) {
    clearInterval(quizTimerInterval);
    document.getElementById('quizOverlay').classList.remove('show');
    showResultModal(message);
}

function showResultModal(msg) {
    document.getElementById('resultMessage').innerText = msg;
    document.getElementById('resultOverlay').classList.add('show');
}

function closeResultModal() {
    document.getElementById('resultOverlay').classList.remove('show');
}

quizInput.addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        checkQuizAnswer();
    }
});

// 1. Danh sách tiêu đề
const titles = [
    "Câu 1: Pangram",

    buttonListContainer.appendChild(btn);
}   

// 4. Các hàm điều khiển Modal
const modalOverlay = document.getElementById('modalOverlay');

function openModal(title, content) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('text-display').innerText = content;
    modalOverlay.classList.add('show');
}

function closeModal() {
    modalOverlay.classList.remove('show');
}

// Copy văn bản
function copyContentFromModal() {
    const textToCopy = document.getElementById('text-display').innerText;
    navigator.clipboard.writeText(textToCopy).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    });
}

// Đóng bằng phím ESC
document.addEventListener('keydown', (e) => {
    if (e.key === "Escape") {
        closeModal();
        closeResultModal();
    }
});
</script>
