<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C++ tasks from somewhere</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* ICON HỆ THỐNG GÓC TRÊN BÊN TRÁI */
        .random-top-left-icon {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 2.2rem;
            z-index: 900;
            user-select: none;
            cursor: pointer;
            transition: transform 0.2s ease;
            background: #ffffff;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .random-top-left-icon:hover {
            transform: scale(1.30);
        }
		/* ICON HỘP QUÀ BIẾT BỎ CHẠY TRƯỢT MƯỢT MÀ */
        .gift-box-icon {
            position: fixed;
            bottom: 30px;
            right: 30px;
            font-size: 2.5rem;
            z-index: 1000;
            user-select: none;
            cursor: pointer;
            
            /* TRỌNG TÂM: Tạo hiệu ứng trượt đi (0.35s) snazzy & mượt */
            transition: left 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.1),
                        top 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.1),
                        transform 0.15s ease-out;
        }

        /* Thêm hoạt ảnh rung nhẹ khi chuẩn bị chạy */
        .gift-box-icon.panic {
            animation: tremor 0.1s infinite;
        }

        @keyframes tremor {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-1px, 1px) rotate(-1deg); }
            50% { transform: translate(1px, -1px) rotate(1deg); }
            75% { transform: translate(-1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }
		/* HIỆU ỨNG CỔNG KHÔNG GIAN (PORTAL) */
		.portal {
		    position: fixed;
		    width: 60px;
		    height: 60px;
		    border-radius: 50%;
		    background: radial-gradient(circle, #00ffff 0%, #8a2be2 70%, transparent 100%);
		  	box-shadow: 0 0 15px #00ffff, 0 0 30px #8a2be2;
		    z-index: 999;
	    	pointer-events: none;
	    	transform: translate(-50%, -50%) scale(0);
	    	animation: portalOpen 0.4s forwards ease-out;
		}

		@keyframes portalOpen {
	    	0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); }
	    	100% { transform: translate(-50%, -50%) scale(1.2) rotate(360deg); }
		}

		.portal-exit {
		    animation: portalClose 0.4s forwards ease-in;
		}

		@keyframes portalClose {
		    0% { transform: translate(-50%, -50%) scale(1.2) rotate(0deg); }
		    100% { transform: translate(-50%, -50%) scale(0) rotate(360deg); }
		}

		/* Hiệu ứng chui vào cổng */
		.gift-box-icon.sucking {
		    transform: scale(0) rotate(720deg) !important;
		    transition: transform 0.4s ease-in !important;
		}
		/* ĐẠN DẤU CHẤM BẮN RA TỪ CHUỘT */
.dot-bullet {
    position: fixed;
    font-size: 2rem;
    font-weight: bold;
    color: #ff3366;
    text-shadow: 0 0 10px #ff3366, 0 0 20px #ff0055;
    pointer-events: none;
    z-index: 1001;
    transform: translate(-50%, -50%);
    transition: left 0.25s linear, top 0.25s linear;
}

/* HIỆU ỨNG HỘP QUÀ BỊ ĐÓNG BẰNG / GIỮ CHÂN 1S */
.gift-box-icon.frozen {
    filter: drop-shadow(0 0 15px #00d2ff) brightness(1.2);
    animation: freezeShake 0.1s infinite !important;
}

@keyframes freezeShake {
    0% { transform: translate(1px, 1px); }
    50% { transform: translate(-1px, -1px); }
    100% { transform: translate(1px, -1px); }
}
        /* KHUNG CHÍNH TRÀN RỘNG TOÀN MÀN HÌNH */
        .container {
            background: #ffffff;
            width: 100%;
            max-width: 100%;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
        }

        h2 {
            color: #2d3748;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        /* Khung cuộn chứa danh sách nút */
        .button-scroll-container {
            max-height: 75vh;
            overflow-y: auto;
            padding: 10px 15px 10px 5px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .button-scroll-container::-webkit-scrollbar {
            width: 8px;
        }

        .button-scroll-container::-webkit-scrollbar-track {
            background: #edf2f7;
            border-radius: 10px;
        }

        .button-scroll-container::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        /* Nút bấm trải rộng 100% chiều ngang */
        .nav-btn {
            width: 100%;
            padding: 16px 24px;
            border: none;
            background: #ffffff;
            color: #4a5568;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            color: #667eea;
            box-shadow: 0 10px 15px -3px rgba(102, 126, 234, 0.25);
        }

        /* MODAL BẬT NỔI & LÀM MỜ NỀN */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        /* CẤU HÌNH Ô POPUP DÀI HƠN */
        .modal-content {
            background: #ffffff;
            width: 90%;
            max-width: 1080px;
            height: 80vh;
            max-height: 920px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.8rem;
            color: #a0aec0;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #e53e3e;
        }

        .modal-title {
            color: #2d3748;
            font-size: 1.3rem;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        /* VÙNG VĂN BẢN CUỘN BÊN TRONG POPUP */
        .text-display {
            color: #4a5568;
            font-size: 1.05rem;
            line-height: 1.6;
            white-space: pre;
            font-family: 'Consolas', 'Courier New', monospace;
            background: #f7fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .text-display::-webkit-scrollbar {
            width: 6px;
        }
        .text-display::-webkit-scrollbar-thumb {
            background: #cbd5e0;
            border-radius: 10px;
        }

        .copy-btn-modal {
            width: 100%;
            background: #38a169;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .copy-btn-modal:hover {
            background: #2f855a;
        }

        /* Toast thông báo */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(46, 160, 67, 0.95);
            color: white;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            z-index: 1100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .toast.show {
            opacity: 1;
        }

        /* STYLES CHO HỘP CÂU ĐỐ ICON */
        .quiz-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .quiz-overlay.show {
            display: flex;
        }
        .quiz-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 16px;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .quiz-timer {
            font-size: 1.8rem;
            font-weight: bold;
            color: #e53e3e;
            margin: 10px 0;
        }
        .quiz-input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 1rem;
            text-align: center;
            outline: none;
        }
        .quiz-btn {
            width: 100%;
            padding: 10px;
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .quiz-btn:hover {
            background: #3182ce;
        }

        /* POPUP KẾT QUẢ CÂU ĐỐ THAY THẾ ALERT */
        .result-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
        }
        .result-overlay.show {
            display: flex;
        }
        .result-box {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 16px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .result-message {
            font-size: 1.2rem;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 20px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<!-- ICON GÓC TRÊN BÊN TRÁI -->
<div class="random-top-left-icon" id="topLeftIcon" title="bleb bleb, don't click me">💻</div>
<!-- ICON HỘP QUÀ BỎ CHẠY -->
<div class="gift-box-icon" id="giftBoxIcon" title="catch me if you can">🎁</div>
<div class="container">
    <h2>My C++ tasks</h2>
    <div class="button-scroll-container" id="buttonList"></div>
</div>

<!-- MODAL CÂU ĐỐ ICON -->
<div class="quiz-overlay" id="quizOverlay">
    <div class="quiz-box">
        <h3>1 + 1 = ?</h3>
        <div class="quiz-timer" id="quizTimer">10</div>
        <input type="text" class="quiz-input" id="quizInput" placeholder="Type your answer here..." autocomplete="off">
        <button class="quiz-btn" onclick="checkQuizAnswer()">Send</button>
    </div>
</div>

<!-- MODAL KẾT QUẢ CÂU ĐỐ (THAY CHO ALERT TRÌNH DUYỆT) -->
<div class="result-overlay" id="resultOverlay">
    <div class="result-box">
        <div class="result-message" id="resultMessage"></div>
        <button class="quiz-btn" onclick="closeResultModal()">OK</button>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h3 class="modal-title" id="modalTitle">Tiêu đề mục</h3>
        <div id="text-display" class="text-display"></div>
        <button class="copy-btn-modal" onclick="copyContentFromModal()">📋 Copy</button>
    </div>
</div>

<div id="toast" class="toast">Copied!</div>

<script>
// 0. Tạo icon ngẫu nhiên từ kho biểu tượng có sẵn trên máy tính người dùng (GIỮ NGUYÊN)
(function generateRandomSystemIcon() {
    const symbolRanges = [
        [0x2300, 0x23FF],
        [0x2600, 0x26FF],
        [0x2700, 0x27BF],
        [0x1F300, 0x1F5FF],
        [0x1F600, 0x1F64F],
        [0x1F680, 0x1F6FF],
        [0x1F900, 0x1F9FF],
        [0x1FA70, 0x1FAFF]
    ];

    const range = symbolRanges[Math.floor(Math.random() * symbolRanges.length)];
    const randomCodePoint = Math.floor(Math.random() * (range[1] - range[0] + 1)) + range[0];
    
    document.getElementById('topLeftIcon').textContent = String.fromCodePoint(randomCodePoint);
})();
const giftBox = document.getElementById('giftBoxIcon');

// Khởi tạo vị trí
if (giftBox) {
    const initRect = giftBox.getBoundingClientRect();
    giftBox.style.left = initRect.left + 'px';
    giftBox.style.top = initRect.top + 'px';
    giftBox.style.bottom = 'auto';
    giftBox.style.right = 'auto';
}

let trappedTimer = null;
let isTeleporting = false;

// Hàm tạo Cổng không gian
function createPortal(x, y) {
    const portal = document.createElement('div');
    portal.className = 'portal';
    portal.style.left = x + 'px';
    portal.style.top = y + 'px';
    document.body.appendChild(portal);
    return portal;
}

// Hàm xử lý nhảy qua Portal sang vị trí mới
function escapeThroughPortal(currentRect) {
    isTeleporting = true;
    
    // 1. Tạo Portal tại vị trí bị kẹt
    const giftCenterX = currentRect.left + currentRect.width / 2;
    const giftCenterY = currentRect.top + currentRect.height / 2;
    const entryPortal = createPortal(giftCenterX, giftCenterY);

    // 2. Thu nhỏ hộp quà chui vào portal
    giftBox.classList.add('sucking');

    setTimeout(() => {
        // Tọa độ ngẫu nhiên mới an toàn ở giữa màn hình
        const margin = 80;
        const maxX = window.innerWidth - currentRect.width - margin;
        const maxY = window.innerHeight - currentRect.height - margin;
        const newX = Math.floor(Math.random() * (maxX - margin)) + margin;
        const newY = Math.floor(Math.random() * (maxY - margin)) + margin;

        // 3. Đóng Portal cũ, tạo Portal mới ở điểm đến
        entryPortal.classList.add('portal-exit');
        setTimeout(() => entryPortal.remove(), 400);

        const exitPortal = createPortal(newX + currentRect.width / 2, newY + currentRect.height / 2);

        // Đặt hộp quà sang vị trí mới
        giftBox.style.left = newX + 'px';
        giftBox.style.top = newY + 'px';

        // 4. Hộp quà chui ra khỏi Portal mới
        setTimeout(() => {
            giftBox.classList.remove('sucking');
            exitPortal.classList.add('portal-exit');
            setTimeout(() => {
                exitPortal.remove();
                isTeleporting = false;
            }, 400);
        }, 100);

    }, 400); // Thời gian chui vào cổng
}

document.addEventListener('mousemove', function(e) {
    if (!giftBox || isTeleporting) return;

    const rect = giftBox.getBoundingClientRect();
    const giftX = rect.left + rect.width / 2;
    const giftY = rect.top + rect.height / 2;

    const diffX = giftX - e.clientX;
    const diffY = giftY - e.clientY;
    const distance = Math.sqrt(diffX * diffX + diffY * diffY);

    const triggerDistance = 120;

    if (distance < triggerDistance) {
        giftBox.classList.add('panic');

        const margin = 40;
        const maxX = window.innerWidth - rect.width - margin;
        const maxY = window.innerHeight - rect.height - margin;

        // Kiểm tra xem có bị dồn sát góc/mép tường không
        const isTrapped = (rect.left <= margin + 10 || rect.left >= maxX - 10 || 
                           rect.top <= margin + 10 || rect.top >= maxY - 10);

        // NẾU BỊ DỒN VÀO GÓC: Đếm đủ 1 giây (1000ms) sẽ kích hoạt Portal
        if (isTrapped) {
            if (!trappedTimer) {
                trappedTimer = setTimeout(() => {
                    escapeThroughPortal(rect);
                    trappedTimer = null;
                }, 1000); // Đếm đúng 1s
            }
        } else {
            // Nếu thoát ra khỏi mép tường thì reset bộ đếm
            if (trappedTimer) {
                clearTimeout(trappedTimer);
                trappedTimer = null;
            }
        }

        // Né bình thường
        const fleeStrength = (triggerDistance - distance) + 120;
        let targetX = giftX + (diffX / (distance || 1)) * fleeStrength;
        let targetY = giftY + (diffY / (distance || 1)) * fleeStrength;

        targetX = Math.max(margin, Math.min(targetX, maxX));
        targetY = Math.max(margin, Math.min(targetY, maxY));

        giftBox.style.left = (targetX - rect.width / 2) + 'px';
        giftBox.style.top = (targetY - rect.height / 2) + 'px';
    } else {
        giftBox.classList.remove('panic');
        if (trappedTimer) {
            clearTimeout(trappedTimer);
            trappedTimer = null;
        }
    }
});
	let mouseX = 0;
let mouseY = 0;
let isFrozen = false; // Trạng thái đóng băng của hộp quà

// 1. Lắng nghe tọa độ chuột hiện tại
document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

// 2. Bắt sự kiện nhấn phím dấu chấm '.'
document.addEventListener('keydown', function(e) {
    // Kiểm tra xem người dùng có gõ phím '.' hay không (KeyNumpadDecimal hoặc Period)
    if (e.key === '.' && giftBox && !isFrozen) {
        shootDotBullet();
    }
});
document.addEventListener('mousemove', function(e) {
    // Nếu hộp quà đang bị đóng băng hoặc đang chuyển giao Portal thì DỪNG NÉ
    if (!giftBox || isTeleporting || isFrozen) return;

    // ... (Giữ nguyên toàn bộ đoạn logic né chuột và Portal phía dưới)
});
// 3. Hàm xử lý bắn đạn dấu chấm từ chuột đến hộp quà
function shootDotBullet() {
    const rect = giftBox.getBoundingClientRect();
    const targetX = rect.left + rect.width / 2;
    const targetY = rect.top + rect.height / 2;

    // Tạo viên đạn dấu chấm ngay tại vị trí con trỏ chuột
    const bullet = document.createElement('div');
    bullet.className = 'dot-bullet';
    bullet.innerText = '•';
    bullet.style.left = mouseX + 'px';
    bullet.style.top = mouseY + 'px';
    document.body.appendChild(bullet);

    // Bắn viên đạn bay tới vị trí hộp quà
    requestAnimationFrame(() => {
        bullet.style.left = targetX + 'px';
        bullet.style.top = targetY + 'px';
    });

    // Khi đạn bay tới nơi (sau 250ms) -> Trúng đích & Giữ chân hộp quà 1 giây
    setTimeout(() => {
        bullet.remove(); // Xóa viên đạn
        
        // Đóng băng hộp quà
        isFrozen = true;
        giftBox.classList.remove('panic');
        giftBox.classList.add('frozen');

        // Sau 1 giây (1000ms) giải phóng hộp quà
        setTimeout(() => {
            isFrozen = false;
            giftBox.classList.remove('frozen');
        }, 1000);

    }, 250);
}
// XỬ LÝ SỰ KIỆN CLICK VÀO ICON GÓC TRÊN BÊN TRÁI
let quizTimerInterval = null;
let quizTimeLeft = 10;
const quizInput = document.getElementById('quizInput');

// 1. HÀM TẠO SỐ NGẪU NHIÊN TỪ 3 ĐẾN 9 (TUỆT ĐỐI KHÔNG CÓ 2)
function getRandomFrom3To9() {
    const validDigits = ['3', '4', '5', '6', '7', '8', '9'];
    return validDigits[Math.floor(Math.random() * validDigits.length)];
}

// 2. XỬ LÝ SỰ KIỆN INPUT: CHỈ GIỮ 0 VÀ 1, MỌI KÝ TỰ KHÁC LẬP TỨC ĐỔI THÀNH SỐ (3-9)
quizInput.addEventListener('input', function() {
    let result = '';
    for (let i = 0; i < this.value.length; i++) {
        let char = this.value[i];
        
        // Nếu là '0' hoặc '1', hoặc là số từ '3' đến '9' đã được tạo trước đó -> GIỮ NGUYÊN
        if (char === '0' || char === '1' || (char >= '3' && char <= '9')) {
            result += char;
        } 
        // Bất kỳ ký tự nào khác (kể cả số 2, chữ cái, ký tự đặc biệt...) -> ĐỔI THÀNH (3-9)
        else {
            result += getRandomFrom3To9();
        }
    }
    this.value = result;
});
document.getElementById('topLeftIcon').onclick = function() {
    document.getElementById('quizOverlay').classList.add('show');
    quizInput.value = '';
    quizInput.focus();
    
    quizTimeLeft = 10;
    document.getElementById('quizTimer').innerText = quizTimeLeft;
    
    clearInterval(quizTimerInterval);
    quizTimerInterval = setInterval(() => {
        quizTimeLeft--;
        document.getElementById('quizTimer').innerText = quizTimeLeft;
        if (quizTimeLeft <= 0) {
            finishQuiz("You are an idiot!\n 🤣🤣🤣");
        }
    }, 1000);
};

function checkQuizAnswer() {
    const val = quizInput.value.trim().toLowerCase();
    
    // Chấp nhận cả chữ "two" lẫn dạng nhị phân "10"
    if (val === "two" || val === "10") {
        finishQuiz("Well...that's right!\n Maybe you're smarter than I thought...");

// 3. Vòng lặp tự động gắn tiêu đề & nội dung vào nút
const buttonListContainer = document.getElementById('buttonList');

for (let i = 0; i < titles.length; i++) {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    
    const titleText = titles[i];
    const contentText = contents[i];
    
    btn.innerHTML = `<span>👨🏽‍💻</span> ${titleText}`;
    
    btn.onclick = function() { 
        openModal(titleText, contentText); 
    };
    
    buttonListContainer.appendChild(btn);
}   

// 4. Các hàm điều khiển Modal
const modalOverlay = document.getElementById('modalOverlay');

function openModal(title, content) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('text-display').innerText = content;
    modalOverlay.classList.add('show');
}

function closeModal() {
    modalOverlay.classList.remove('show');
}

// Copy văn bản
function copyContentFromModal() {
    const textToCopy = document.getElementById('text-display').innerText;
    navigator.clipboard.writeText(textToCopy).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    });
}

// Đóng bằng phím ESC
document.addEventListener('keydown', (e) => {
    if (e.key === "Escape") {
        closeModal();
        closeResultModal();
    }
});
